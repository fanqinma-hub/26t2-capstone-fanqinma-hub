services:
  expo-app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "8081:8081"

    env_file:
      - .env.local

    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    command:
      - npx
      - expo
      - start
      - --web
      - --host
      - lan
      - --port
      - "8081"
      - --clear

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8081 >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    stdin_open: true
    tty: true
services:
  expo-app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: 192.168.1.103 # fill your ip 

      CHOKIDAR_USEPOLLING: "true"

    command: >
      npx expo start --host lan

    stdin_open: true
    tty: true